<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Pragu Tech Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
    
       body{
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.4s;
}

/* Light Theme */
body.light-theme{
    background:linear-gradient(135deg,#0d6efd,#4f46e5);
}

/* Dark Theme */
body.dark-theme{
    background:linear-gradient(135deg,#0f172a,#020617);
}

.thank-card{
    width:650px;
    padding:60px;
    border-radius:25px;
    text-align:center;
    transition:.4s;
}

/* Light Card */
body.light-theme .thank-card{
    background:#ffffff;
    color:#222;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
}

/* Dark Card */
body.dark-theme .thank-card{
    background:#111827;
    color:#f8f9fa;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

body.dark-theme p{
    color:#cbd5e1;
}

body.light-theme p{
    color:#6c757d;
}

.thank-icon{
    font-size:90px;
    color:#22c55e;
}

.btn-home{
    margin-top:30px;
    padding:12px 35px;
    border-radius:12px;
    font-weight:600;
}
/* Light Theme Button */
body.light-theme .btn-home{
    background:#0d6efd;
    color:white;
    border:none;
}

body.light-theme .btn-home:hover{
    background:#0b5ed7;
}

/* Dark Theme Button */
body.dark-theme .btn-home{
    background:linear-gradient(90deg,#38bdf8,#6366f1);
    color:white;
    border:none;
}

body.dark-theme .btn-home:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(99,102,241,.4);
}
    </style>

</head>

<body>

<div class="thank-card">

    <i class="fas fa-circle-check thank-icon"></i>

    <h1>Thank You!</h1>

    <p>

        Your request has been submitted successfully.

        <br><br>

        Our team has received your enquiry and will contact you shortly to discuss your project.

    </p>

    <a href="/" class="btn btn-primary btn-home">

        Back to Home

    </a>

</div>
<script>

const theme = localStorage.getItem("theme") || "light";

if(theme === "dark"){
    document.body.classList.add("dark-theme");
}
else{
    document.body.classList.add("light-theme");
}

</script>
</body>

</html>
