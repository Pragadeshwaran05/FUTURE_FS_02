<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LeadFlow CRM</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

            background:#0B1020;
        }

       .login-box{

    width:420px;
    background:#171F34;
    padding:45px;
    border-radius:20px;
    box-shadow:0 0 40px rgba(139,92,246,.25);

}

        h1{

            text-align:center;

            color:#8B5CF6;

            margin-bottom:30px;
        }

        input{

            width:100%;

            padding:14px;

            margin-bottom:20px;

            border:none;

            border-radius:10px;

            background:#202943;

            color:white;

            font-size:16px;

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#8B5CF6;

            color:white;

            font-size:17px;

            cursor:pointer;

        }

        button:hover{

            background:#7C3AED;

        }

        p{

            color:white;

            text-align:center;

            margin-top:20px;

        }
        /* Light Theme */
body.light-theme{
    background:#f4f7fc;
    color:#000;
}

body.light-theme .login-card{
    background:#ffffff;
    color:#000;
}

body.light-theme .login-card h2,
body.light-theme label{
    color:#000;
}

body.light-theme input{
    background:#ffffff;
    color:#000;
    border:1px solid #ced4da;
}

/* Dark Theme */
body.dark-theme{
    background:#0f172a;
    color:#fff;
}

body.dark-theme .login-card{
    background:#1e293b;
    color:#fff;
}

body.dark-theme .login-card h2,
body.dark-theme label{
    color:#fff;
}

body.dark-theme input{
    background:#334155;
    color:#fff;
    border:1px solid #475569;
}
body.light-theme .login-title{
    color:#2563eb;
}

    </style>

</head>

<body>

<div class="login-box">

    <h2 class="login-title">LeadFlow CRM</h2>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="login-error">
    ❌ {{ messages[0] }}
</div>
    {% endif %}
{% endwith %}
    <form method="POST">

        <input
        type="text"
        name="username"
        placeholder="Username"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
