{% extends "base.html" %}

{% block title %}Edit Lead{% endblock %}

{% block content %}

<h1>Edit Lead</h1>

<p style="color:#9CA3AF;margin-bottom:30px;">
    Update customer information
</p>

<form method="POST">

    <div class="form-group">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ lead['name'] }}"
            required>

    </div>

    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ lead['email'] }}">

    </div>

    <div class="form-group">

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ lead['phone'] }}">

    </div>

    <div class="form-group">

        <label>Company</label>

        <input
            type="text"
            name="company"
            value="{{ lead['company'] }}">

    </div>

    <div class="form-group">

        <label>Status</label>

        <select name="status">

            <option value="New"
                {% if lead['status'] == 'New' %}selected{% endif %}>
                New
            </option>

            <option value="Contacted"
                {% if lead['status'] == 'Contacted' %}selected{% endif %}>
                Contacted
            </option>

            <option value="Follow-up"
                {% if lead['status'] == 'Follow-up' %}selected{% endif %}>
                Follow-up
            </option>

            <option value="Converted"
                {% if lead['status'] == 'Converted' %}selected{% endif %}>
                Converted
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Requirement</label>

        <textarea
            rows="6"
            name="message">{{ lead['message'] }}</textarea>

    </div>

    <button class="save-btn">

        Update Lead

    </button>

</form>

{% endblock %}
