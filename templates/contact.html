<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request a Free Consultation | LeadFlow CRM</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:#0B1020;
            color:white;
            min-height:100vh;

        }

        .container{

            max-width:1200px;
            margin:auto;
            padding:60px 20px;

        }

        .header{

            text-align:center;
            margin-bottom:50px;

        }

        .header h1{

            font-size:42px;
            margin-bottom:15px;

        }

        .header p{

            color:#9CA3AF;
            font-size:18px;

        }

        .form-box{

            background:#171F34;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,.35);

        }

        .grid{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;

        }

        .form-group{

            display:flex;
            flex-direction:column;

        }

        .full{

            grid-column:1 / -1;

        }

        label{

            margin-bottom:8px;
            font-weight:600;

        }

        input,
        select,
        textarea{

            padding:14px;
            border:none;
            border-radius:10px;
            background:#0F172A;
            color:white;
            font-size:15px;

        }

        textarea{

            resize:none;

        }

        button{

            margin-top:30px;
            width:100%;
            padding:16px;
            background:#8B5CF6;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#7C3AED;

        }

    </style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🚀 Request a Free Project Consultation</h1>

<p>
Tell us about your project. Our team will contact you within 24 hours.
</p>

</div>

<div class="form-box">

<form method="POST">

<div class="grid">

<div class="form-group">

<label>Full Name</label>

<input type="text" name="name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" name="email" required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="text" name="phone" required>

</div>

<div class="form-group">

<label>Company Name</label>

<input type="text" name="company">

</div>

<div class="form-group">

<label>Service Required</label>

<select name="service">

<option>Website Development</option>

<option>E-Commerce Website</option>

<option>CRM Development</option>

<option>Mobile App</option>

<option>AI / ML Solution</option>

<option>UI/UX Design</option>

</select>

</div>

<div class="form-group">

<label>Estimated Budget</label>

<select name="budget">

<option>Below ₹50,000</option>

<option>₹50,000 - ₹1,00,000</option>

<option>₹1,00,000 - ₹3,00,000</option>

<option>Above ₹3,00,000</option>

</select>

</div>

<div class="form-group full">

<label>Project Requirements</label>

<textarea rows="6" name="message"></textarea>

</div>

</div>

<button type="submit">

Submit Request

</button>

</form>

</div>

</div>
<script>
const theme = localStorage.getItem("theme") || "light";

if(theme === "dark"){
    document.body.classList.add("dark-theme");
}
</script>
</body>

</html>
