{% extends "base.html" %}

{% block title %}Add Lead{% endblock %}

{% block content %}

<h1>Add New Lead</h1>
<p style="color:#9CA3AF;margin-bottom:30px;">
Enter the client details below.
</p>

<form method="POST">

<div class="form-group">
<label>Client Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email">
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone">
</div>

<div class="form-group">
<label>Company</label>
<input type="text" name="company">
</div>

<div class="form-group">
<label>Lead Source</label>

<select name="source">

<option>Website</option>
<option>Facebook</option>
<option>Instagram</option>
<option>LinkedIn</option>
<option>Referral</option>

</select>

</div>

<div class="form-group">
<label>Status</label>

<select name="status">

<option>New</option>
<option>Contacted</option>
<option>Follow-up</option>
<option>Converted</option>

</select>

</div>
<div class="form-group">
    <label>Service Required</label>

    <select name="service" required>
        <option value="">Select Service</option>
        <option>Website Development</option>
        <option>Mobile App Development</option>
        <option>Digital Marketing</option>
        <option>SEO</option>
        <option>UI/UX Design</option>
        <option>Cloud Solutions</option>
        <option>AI / ML Solution</option>
    </select>
</div>

<div class="form-group">
    <label>Estimated Budget</label>

    <select name="budget" required>
        <option value="">Select Budget</option>
        <option>Below ₹50,000</option>
        <option>₹50,000 - ₹1,00,000</option>
        <option>₹1,00,000 - ₹5,00,000</option>
        <option>Above ₹5,00,000</option>
    </select>
</div>

<div class="form-group">
    <label>Project Details</label>

    <textarea
        name="message"
        rows="5"
        placeholder="Describe the client's requirements..."></textarea>
</div>
<button class="save-btn">

Save Lead

</button>

</form>

{% endblock %}
